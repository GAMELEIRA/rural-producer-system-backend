spring.application.name=gestao-microprodutores-api

spring.datasource.url=jdbc:mysql://localhost:3306/gestao_microprodutores_db?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

api.security.token.secret=${JWT_SECRET:minha-chave2026}


# CORS: origens do frontend (separadas por virgula). Padrao: qualquer porta em localhost.
api.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# Logs de integracao: requisicoes/respostas HTTP, seguranca e tratamento de erros
logging.level.br.gov.sp.etec.gestaomicroprodutores=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
