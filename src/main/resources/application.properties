spring.application.name=gestao-microprodutores-api

spring.datasource.url=jdbc:mysql://localhost:3306/gestao_microprodutores_db?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

api.security.token.secret=${JWT_SECRET:minha-chave-secreta-tcc-agro-2026}

