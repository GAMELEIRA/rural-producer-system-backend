name: Backend CI
on:
  push:
    branches: [main, feat/conclusao-gestao-rural]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: ./mvnw -B -DskipTests=false test
